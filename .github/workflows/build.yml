name: Build APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Generate Keystore
      run: |
        keytool -genkeypair -v -keystore android/release.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease -PRELEASE_STORE_FILE=release.keystore -PRELEASE_STORE_PASSWORD=android -PRELEASE_KEY_ALIAS=androiddebugkey -PRELEASE_KEY_PASSWORD=android

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: android/build/outputs/apk/release/android-release.apk
